name: Crossword
options:
  bundleIdPrefix: com.zakaria
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "12.0.0"

targets:
  Crossword:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Features/Catalog/**"     # design check only (tools/render_catalog.swift); never shipped
      - path: Resources/Packs
        type: folder                  # keeps the Packs/ subdirectory in the bundle
      - path: Resources/Fonts
      - path: Resources/Sounds
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: GoogleMobileAds
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "كلمات"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [NotoNaskhArabic.ttf]
        CFBundleDevelopmentRegion: ar
        ITSAppUsesNonExemptEncryption: false
        GADApplicationIdentifier: ca-app-pub-4306191597700064~4043802655
        # Concrete purpose, matches what the app does (APP-STORE-REVIEW.md ⛔1)
        NSUserTrackingUsageDescription: "نستخدم هذا المعرّف لعرض إعلانات أكثر ملاءمة لك. اللعبة تعمل كاملة سواء سمحت أم لا."
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    scheme:
      testTargets:
        - CrosswordUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakaria.crossword
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: "JF83ACY9N9"
        CODE_SIGN_STYLE: Automatic
        # ⛔ APP-STORE-REVIEW.md §3: device family on the TARGET, not the project
        TARGETED_DEVICE_FAMILY: "1"

  CrosswordUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: Resources/Packs
        type: folder                  # tests read the real answers
      # pure game logic, so word-search tests know where each word is hidden
      - path: Sources/Models/Content.swift
      - path: Sources/Game
    dependencies:
      - target: Crossword
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakaria.crossword.uitests
        DEVELOPMENT_TEAM: "JF83ACY9N9"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Crossword
